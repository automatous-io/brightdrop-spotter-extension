name: pages

# Publishes web/ plus the shared decoder to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['web/**', 'vin.js', 'sticker.js', 'docs/screenshots/hero.png', 'scripts/web.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Decoder, batch and sticker tests
        run: npm test
      - name: Assemble the site
        run: node scripts/web.mjs build _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
